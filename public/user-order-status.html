<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用戶 - 訂單狀態</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #FFD700;
            --dark-bg: #0A0A0A;
            --dark-card: #1A1A1A;
            --gold-gradient: linear-gradient(45deg, #B8860B, #D4AF37);
        }
    
        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding-top: 0;
            min-height: 100vh;
        }
    
        .nav-ios {
            background-color: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 1rem 0;
            margin-bottom: 2rem;
        }
    
        .nav-ios h1 {
            color: var(--gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
    
        .card {
            background-color: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
            transition: all 0.3s ease;
            margin-bottom: 2rem;
            border-radius: 13px;
            color: #FFFFFF;
        }
    
        .card:hover {
            border-color: var(--gold);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
            transform: translateY(-2px);
        }
    
        .card-header {
            background-color: rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--gold);
            padding: 1rem;
            border-radius: 13px 13px 0 0;
        }
    
        .card-body {
            color: #FFFFFF;
            padding: 1.5rem;
        }
    
        .btn {
            border-radius: 8px;
            padding: 8px 16px;
            transition: all 0.3s ease;
            font-weight: 500;
        }
    
        .btn-primary {
            background: var(--gold-gradient);
            border: none;
            color: #000;
            font-weight: 600;
            transition: all 0.3s ease;
        }
    
        .btn-primary:hover {
            background: linear-gradient(45deg, var(--gold), #B8860B);
            transform: translateY(-2px);
            color: #000;
        }
    
        .btn-primary:disabled {
            background: #666;
            color: #fff;
            transform: none;
        }
    
        .form-control {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #FFFFFF;
            padding: 0.75rem;
            border-radius: 8px;
            height: auto;
            font-size: 16px;
        }
    
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
    
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: var(--gold);
            box-shadow: 0 0 0 0.25rem rgba(212, 175, 55, 0.25);
            color: #FFFFFF;
        }
    
        .input-group {
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border-radius: 8px;
            overflow: hidden;
        }
    
        .form-label {
            color: var(--gold);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
    
        .order-status {
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.9em;
        }
    
        .status-pending {
            background: linear-gradient(45deg, #B8860B, var(--gold));
            color: #000000;
            font-weight: bold;
        }
    
        .status-completed {
            background: linear-gradient(45deg, #2E7D32, #4CAF50);
            color: #FFFFFF;
            font-weight: bold;
        }
    
        .order-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.3s ease;
            color: #FFFFFF;
        }
    
        .order-item:last-child {
            border-bottom: none;
        }
    
        .order-item:hover {
            background-color: rgba(212, 175, 55, 0.1);
        }
    
        .order-item .fw-bold {
            color: var(--gold);
        }
    
        .order-item span:last-child {
            color: var(--gold);
            font-weight: 500;
        }
    
        .alert {
            background-color: rgba(26, 26, 26, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: #FFFFFF;
            border-radius: 13px;
            margin-bottom: 1rem;
        }
    
        .alert-warning {
            border-left: 4px solid #FFC107;
        }
    
        .alert-danger {
            border-left: 4px solid #DC3545;
        }
    
        .alert-info {
            border-left: 4px solid var(--gold);
        }
    
        .text-muted {
            color: rgba(255, 255, 255, 0.7) !important;
        }
    
        .h5 {
            color: var(--gold) !important;
            font-weight: 600;
        }
    
        .card-header .h6 {
            color: var(--gold);
            font-weight: 600;
        }
    
        /* Particles Effect */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
    
        .particle {
            position: absolute;
            background: rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            pointer-events: none;
            animation: float 5s infinite ease-in-out;
        }
    
        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            25% {
                opacity: 0.5;
            }
            50% {
                transform: translateY(-20px) translateX(10px);
                opacity: 0.8;
            }
            75% {
                opacity: 0.5;
            }
        }
    
        /* Fade In Animation */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
    
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    
        /* Spinner */
        .spinner-border {
            color: #000;
        }
    
        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0 15px;
            }
            
            .card {
                margin-bottom: 15px;
            }
            
            .nav-ios {
                padding: 0.5rem 0;
            }
    
            .btn {
                padding: 8px 12px;
            }
    
            .form-control {
                font-size: 14px;
            }
        }
    
        /* Dark mode scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
    
        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
    
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }
    
        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-light);
        }
    </style>    
</head>
<div id="particles" class="particles"></div>
    
    <nav class="nav-ios">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h1 class="h4 mb-0">我的訂單</h1>
                <a href="/" class="btn btn-primary">返回點餐頁面</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card mb-4 fade-in">
            <div class="card-body">
                <label for="tableNumber" class="form-label">輸入您的桌號：</label>
                <div class="input-group">
                    <input type="number" 
                           class="form-control" 
                           id="tableNumber" 
                           min="1" 
                           placeholder="請輸入桌號"
                           autocomplete="off">
                    <button class="btn btn-primary" id="searchOrderBtn">
                        <span class="d-none d-sm-inline">查詢訂單</span>
                        <span class="d-inline d-sm-none">查詢</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="orderStatus"></div>
    </div>

    <script>
        // 添加粒子效果
        function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;

            container.innerHTML = '';

            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 6 + 4 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.top = Math.random() * 100 + 'vh';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(particle);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            function getTableNumberFromUrl() {
                const pathSegments = window.location.pathname.split('/');
                for (let i = pathSegments.length - 1; i >= 0; i--) {
                    const num = parseInt(pathSegments[i]);
                    if (!isNaN(num)) {
                        return num;
                    }
                }
                return null;
            }

            const tableNumber = getTableNumberFromUrl();
            if (!tableNumber) {
                window.location.href = '/';
                return;
            }

            // 修改返回連結
            document.querySelectorAll('a').forEach(link => {
                if (link.href.includes('index.html')) {
                    // 確保生成正確的返回路徑
                    link.href = `/${tableNumber}`;
                }
            });

            createParticles();
            setInterval(createParticles, 10000);
            const tableNumberInput = document.getElementById('tableNumber');
            if (tableNumberInput) {
                tableNumberInput.value = tableNumber;
                tableNumberInput.readOnly = true;
            }
            const searchOrderBtn = document.getElementById('searchOrderBtn');
            if (searchOrderBtn) {
                searchOrderBtn.click();
            }
            const orderStatusContainer = document.getElementById('orderStatus');

            // 輸入框按 Enter 觸發查詢
            tableNumberInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    searchOrderBtn.click();
                }
            });

            searchOrderBtn.addEventListener('click', async () => {
                const tableNumber = parseInt(tableNumberInput.value, 10);

                if (isNaN(tableNumber)) {
                    orderStatusContainer.innerHTML = `
                        <div class="alert alert-warning fade-in">
                            請輸入有效的桌號
                        </div>
                    `;
                    return;
                }

                // 添加載入動畫
                searchOrderBtn.disabled = true;
                searchOrderBtn.innerHTML = `
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    <span class="ms-1">查詢中...</span>
                `;

                try {
                    const response = await fetch(`/user/orders/${tableNumber}`);
                    const orders = await response.json();

                    // 清空目前的訂單
                    orderStatusContainer.innerHTML = '';

                    if (orders.length === 0) {
                        orderStatusContainer.innerHTML = `
                            <div class="alert alert-info fade-in">
                                該桌目前沒有訂單
                            </div>
                        `;
                    } else {
                        // 渲染訂單
                        orders.forEach(order => {
                            const orderCard = createOrderCard(order);
                            orderStatusContainer.appendChild(orderCard);
                            setTimeout(() => orderCard.classList.add('show'), 10);
                        });
                    }
                } catch (error) {
                    console.error('載入訂單失敗:', error);
                    orderStatusContainer.innerHTML = `
                        <div class="alert alert-danger fade-in">
                            無法載入訂單，請稍後再試
                        </div>
                    `;
                } finally {
                    // 恢復按鈕狀態
                    searchOrderBtn.disabled = false;
                    searchOrderBtn.innerHTML = `
                        <span class="d-none d-sm-inline">查詢訂單</span>
                        <span class="d-inline d-sm-none">查詢</span>
                    `;
                }
            });

            function createOrderCard(order) {
                const card = document.createElement('div');
                card.className = 'card order-card fade-in';
                card.innerHTML = `
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span class="h6 mb-0">訂單 #${order.id}</span>
                        <span class="order-status ${order.status === 'pending' ? 'status-pending' : 'status-completed'}">
                            ${order.status === 'pending' ? '處理中' : '已完成'}
                        </span>
                    </div>
                    <div class="card-body">
                        <div class="text-muted mb-3">
                            訂單時間：${new Date(order.timestamp).toLocaleString()}
                        </div>
                        ${order.orders.map(item => `
                            <div class="order-item d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="fw-bold">${item.name}</span>
                                    <span class="text-muted">x${item.quantity}</span>
                                </div>
                                <span>${(item.price * item.quantity).toFixed(2)}元</span>
                            </div>
                        `).join('')}
                        <div class="mt-3 pt-3 border-top d-flex justify-content-between align-items-center">
                            <span class="text-muted">總金額</span>
                            <span class="h5 mb-0">${calculateTotal(order.orders)}元</span>
                        </div>
                    </div>
                `;

                return card;
            }

            function calculateTotal(items) {
                return items.reduce((total, item) => total + (item.quantity * item.price), 0).toFixed(2);
            }

            // 自動刷新訂單
            setInterval(() => {
                if (tableNumberInput.value && !searchOrderBtn.disabled) {
                    searchOrderBtn.click();
                }
            }, 30000);
        });
    </script>
</body>
</html>
